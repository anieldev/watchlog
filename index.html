<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watchlist One-Page Prototype</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #09090b;
        --foreground: #fafafa;
        --card: #111113;
        --card-soft: #161618;
        --popover: #18181b;
        --muted: #a1a1aa;
        --muted-foreground: #71717a;
        --border: #27272a;
        --border-soft: rgba(255, 255, 255, 0.08);
        --accent: #e11d48;
        --accent-soft: rgba(225, 29, 72, 0.16);
        --ring: rgba(244, 63, 94, 0.42);
        --radius: 8px;
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.46);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(180deg, rgba(225, 29, 72, 0.13), transparent 260px),
          radial-gradient(circle at 82% 0%, rgba(59, 130, 246, 0.14), transparent 360px),
          var(--background);
        color: var(--foreground);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      .app {
        min-height: 100vh;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 18px clamp(16px, 4vw, 56px);
        border-bottom: 1px solid var(--border-soft);
        background: rgba(9, 9, 11, 0.76);
        backdrop-filter: blur(18px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: var(--radius);
        background: var(--foreground);
        color: var(--background);
        font-weight: 800;
      }

      .brand-copy {
        min-width: 0;
      }

      .brand-copy strong {
        display: block;
        font-size: 14px;
        letter-spacing: 0;
      }

      .brand-copy span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .search {
        width: min(360px, 36vw);
        min-height: 38px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0 12px;
        background: rgba(24, 24, 27, 0.78);
        color: var(--foreground);
        outline: none;
      }

      .search:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--ring);
      }

      main {
        padding: 26px clamp(16px, 4vw, 56px) 60px;
      }

      .hero {
        min-height: 390px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 420px;
        gap: 28px;
        align-items: end;
        margin-bottom: 24px;
      }

      .spotlight {
        min-height: 390px;
        position: relative;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background:
          linear-gradient(90deg, rgba(9, 9, 11, 0.9) 0%, rgba(9, 9, 11, 0.64) 38%, transparent 75%),
          linear-gradient(145deg, var(--tone), #18181b 62%);
      }

      .spotlight::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(135deg, transparent 0 42%, rgba(255, 255, 255, 0.09) 42% 43%, transparent 43%),
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 64px);
        pointer-events: none;
      }

      .spotlight-content {
        position: relative;
        z-index: 1;
        max-width: 610px;
        padding: clamp(24px, 5vw, 48px);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 28px;
        margin-bottom: 18px;
        border: 1px solid var(--border-soft);
        border-radius: 999px;
        padding: 0 10px;
        background: rgba(24, 24, 27, 0.72);
        color: var(--muted);
        font-size: 12px;
      }

      h1 {
        max-width: 720px;
        margin: 0 0 14px;
        font-size: clamp(42px, 7vw, 86px);
        line-height: 0.94;
        letter-spacing: 0;
      }

      .hero p {
        max-width: 580px;
        margin: 0;
        color: #d4d4d8;
        line-height: 1.6;
        font-size: 16px;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
      }

      .button {
        min-height: 38px;
        border: 1px solid transparent;
        border-radius: var(--radius);
        padding: 0 14px;
        background: var(--foreground);
        color: var(--background);
        cursor: pointer;
        font-weight: 650;
      }

      .button.secondary {
        border-color: var(--border);
        background: rgba(24, 24, 27, 0.78);
        color: var(--foreground);
      }

      .stats-panel {
        align-self: stretch;
        display: grid;
        gap: 12px;
      }

      .stat-card {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px;
        background: rgba(17, 17, 19, 0.76);
      }

      .stat-card span {
        color: var(--muted);
        font-size: 13px;
      }

      .stat-card strong {
        display: block;
        margin-top: 8px;
        font-size: 28px;
        letter-spacing: 0;
      }

      .tabs {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding: 6px 0 18px;
        scrollbar-width: none;
      }

      .tabs::-webkit-scrollbar,
      .rail::-webkit-scrollbar {
        display: none;
      }

      .tab {
        min-height: 38px;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0 15px;
        background: rgba(24, 24, 27, 0.74);
        color: var(--muted);
        cursor: pointer;
        white-space: nowrap;
      }

      .tab.active {
        border-color: rgba(244, 63, 94, 0.48);
        background: var(--accent-soft);
        color: #fff1f2;
      }

      .shelf {
        margin-top: 22px;
      }

      .shelf-header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
      }

      .shelf h2 {
        margin: 0;
        font-size: clamp(20px, 2.3vw, 28px);
        letter-spacing: 0;
      }

      .shelf-header span {
        color: var(--muted-foreground);
        font-size: 13px;
      }

      .rail {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: clamp(172px, 18vw, 238px);
        gap: 12px;
        overflow-x: auto;
        overscroll-behavior-inline: contain;
        padding: 2px 2px 14px;
        scroll-snap-type: inline mandatory;
      }

      .thumb {
        position: relative;
        min-height: 304px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        background: var(--card);
        cursor: pointer;
        scroll-snap-align: start;
        text-align: left;
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          background 160ms ease;
      }

      .thumb:hover {
        transform: translateY(-3px);
        border-color: rgba(255, 255, 255, 0.28);
      }

      .poster {
        min-height: 222px;
        position: relative;
        background:
          linear-gradient(180deg, transparent 46%, rgba(9, 9, 11, 0.86)),
          radial-gradient(circle at 26% 18%, rgba(255, 255, 255, 0.2), transparent 5rem),
          linear-gradient(145deg, var(--tone), #18181b 66%);
      }

      .poster::before {
        content: "";
        position: absolute;
        inset: 14px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: calc(var(--radius) - 2px);
      }

      .poster::after {
        content: "";
        position: absolute;
        right: 18px;
        bottom: 18px;
        width: 50px;
        height: 50px;
        border-right: 2px solid rgba(255, 255, 255, 0.52);
        border-bottom: 2px solid rgba(255, 255, 255, 0.52);
      }

      .badge {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        border-radius: 999px;
        padding: 0 9px;
        background: rgba(9, 9, 11, 0.72);
        color: var(--foreground);
        font-size: 12px;
        font-weight: 650;
      }

      .thumb-body {
        padding: 12px;
      }

      .thumb h3 {
        margin: 0 0 7px;
        color: white;
        font-size: 15px;
        line-height: 1.2;
      }

      .thumb p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .drawer-backdrop {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: none;
        background: rgba(0, 0, 0, 0.58);
      }

      .drawer-backdrop.open {
        display: block;
      }

      .drawer {
        position: fixed;
        inset: 0 0 0 auto;
        z-index: 50;
        width: min(560px, 100vw);
        display: flex;
        flex-direction: column;
        border-left: 1px solid var(--border);
        background: rgba(9, 9, 11, 0.96);
        box-shadow: var(--shadow);
        transform: translateX(100%);
        transition: transform 220ms ease;
      }

      .drawer.open {
        transform: translateX(0);
      }

      .drawer-art {
        min-height: 184px;
        position: relative;
        background:
          linear-gradient(0deg, rgba(9, 9, 11, 1), transparent 48%),
          linear-gradient(145deg, var(--tone), #18181b 68%);
      }

      .drawer-art::after {
        content: "";
        position: absolute;
        inset: 22px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: var(--radius);
      }

      .drawer-close {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 3;
        width: 36px;
        height: 36px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: var(--radius);
        background: rgba(9, 9, 11, 0.74);
        cursor: pointer;
      }

      .drawer-content {
        overflow-y: auto;
        padding: 24px;
      }

      .drawer-title {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 18px;
      }

      .drawer h2 {
        margin: 0;
        font-size: 36px;
        line-height: 1;
      }

      .score {
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        width: 54px;
        height: 54px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        background: var(--accent-soft);
        color: #fff1f2;
        font-weight: 800;
      }

      .meta-line {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 13px 0 18px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 27px;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0 9px;
        color: #d4d4d8;
        background: rgba(24, 24, 27, 0.82);
        font-size: 12px;
      }

      .description {
        margin: 0 0 22px;
        color: #d4d4d8;
        line-height: 1.6;
      }

      .detail-grid {
        display: grid;
        gap: 16px;
      }

      .detail-section {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        background: rgba(17, 17, 19, 0.72);
      }

      .detail-section h3 {
        margin: 0 0 12px;
        color: white;
        font-size: 14px;
      }

      .kv {
        display: grid;
        grid-template-columns: 140px minmax(0, 1fr);
        gap: 10px;
        padding: 9px 0;
        border-top: 1px solid var(--border-soft);
        color: #e4e4e7;
        font-size: 14px;
      }

      .kv:first-of-type {
        border-top: 0;
        padding-top: 0;
      }

      .kv span:first-child {
        color: var(--muted);
      }

      .people {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .person {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 7px 9px;
        background: rgba(24, 24, 27, 0.7);
        color: #e4e4e7;
        font-size: 13px;
      }

      .empty {
        display: none;
        min-height: 190px;
        border: 1px dashed var(--border);
        border-radius: var(--radius);
        place-items: center;
        color: var(--muted);
        background: rgba(17, 17, 19, 0.54);
      }

      .empty.visible {
        display: grid;
      }

      @media (max-width: 980px) {
        .hero {
          grid-template-columns: 1fr;
        }

        .stats-panel {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (max-width: 720px) {
        .topbar {
          align-items: stretch;
          flex-direction: column;
        }

        .search {
          width: 100%;
        }

        main {
          padding-inline: 14px;
        }

        .hero,
        .spotlight {
          min-height: 330px;
        }

        .stats-panel {
          grid-template-columns: 1fr;
        }

        .rail {
          grid-auto-columns: 164px;
        }

        .thumb {
          min-height: 276px;
        }

        .poster {
          min-height: 196px;
        }

        .drawer-content {
          padding: 18px;
        }

        .drawer h2 {
          font-size: 30px;
        }

        .kv {
          grid-template-columns: 1fr;
          gap: 4px;
        }
      }
    </style>
  </head>

    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">W</div>
          <div class="brand-copy">
            <strong>Watchlog</strong>
            <span>Movies, shows, anime</span>
          </div>
        </div>
        <input id="search" class="search" type="search" placeholder="Search your archive" />
      </header>

      <main>
        <section class="hero" aria-label="Featured title">
          <div id="spotlight" class="spotlight" style="--tone: #78350f">
            <div class="spotlight-content">
              <div class="eyebrow">Featured from your archive</div>
              <h1 id="spotlightTitle">Dune: Part Two</h1>
              <p id="spotlightCopy">
                Desert myth, political machinery, and a blockbuster sense of scale that still
                leaves room for dread.
              </p>
              <div class="hero-actions">
                <button class="button" id="openFeatured">View details</button>
                <button class="button secondary">Mark rewatch</button>
              </div>
            </div>
          </div>

          <aside class="stats-panel" aria-label="Archive statistics">
            <div class="stat-card"><span>Total watched</span><strong id="totalStat">0</strong></div>
            <div class="stat-card"><span>Average rating</span><strong id="ratingStat">0.0</strong></div>
            <div class="stat-card"><span>Hours tracked</span><strong id="hoursStat">0h</strong></div>
          </aside>
        </section>

        <nav id="typeTabs" class="tabs" aria-label="Media filters"></nav>
        <div id="shelves"></div>
        <div id="emptyState" class="empty">No matches in this archive view.</div>
      </main>
    </div>

    <div id="backdrop" class="drawer-backdrop"></div>
    <aside id="drawer" class="drawer" aria-hidden="true" aria-label="Title details">
      <div id="drawerArt" class="drawer-art">
        <button id="closeDrawer" class="drawer-close" aria-label="Close details">x</button>
      </div>

            Country: "Japan",
            Language: "Japanese",
            Release: "September 2001"
          },
          staff: {
            Director: "Satoshi Kon",
            Writer: "Satoshi Kon, Sadayuki Murai",
            Music: "Susumu Hirasawa",
            Producer: "Taro Maki"
          }
        }
      ];

      const filters = ["All", "Movies", "Shows", "Anime"];
      const shelfOrder = [
        "Recently watched",
        "Highest rated",
        "Continue the feeling",
        "Quiet nights",
        "Anime shelf",
        "Shows to revisit"
      ];

      const state = {
        filter: "All",
        query: "",
        featured: "dune-two"
      };

      const shelves = document.querySelector("#shelves");
      const tabs = document.querySelector("#typeTabs");
      const search = document.querySelector("#search");
      const drawer = document.querySelector("#drawer");
      const backdrop = document.querySelector("#backdrop");
      const drawerContent = document.querySelector("#drawerContent");
      const drawerArt = document.querySelector("#drawerArt");

      function typeMatches(item) {
        if (state.filter === "All") return true;
        if (state.filter === "Movies") return item.type === "Movie";
        if (state.filter === "Shows") return item.type === "Show";
        return item.type === "Anime";
      }

      function searchMatches(item) {
        const q = state.query.trim().toLowerCase();
        if (!q) return true;
        return [
          item.title,
          item.type,
          item.year,
          item.description,
          item.genre.join(" "),
          item.cast.join(" "),
          item.characters.join(" ")
        ].join(" ").toLowerCase().includes(q);
      }

      function visibleTitles() {
        return titles.filter(item => typeMatches(item) && searchMatches(item));
      }

      function renderTabs() {
        tabs.innerHTML = filters.map(filter => `
          <button class="tab ${state.filter === filter ? "active" : ""}" data-filter="${filter}">
            ${filter}
          </button>
        `).join("");
      }

      function cardTemplate(item) {
        return `
          <button class="thumb" data-id="${item.id}">
            <div class="poster" style="--tone: ${item.tone}">
              <span class="badge">${item.rating.toFixed(1)}</span>
            </div>
            <div class="thumb-body">
              <h3>${item.title}</h3>
              <p>${item.type} / ${item.year} / ${item.genre.slice(0, 2).join(", ")}</p>
            </div>
          </button>
        `;
      }

      function renderShelves() {
        const visible = visibleTitles();
        const blocks = shelfOrder
          .map(section => {
            const items = visible.filter(item => item.section.includes(section));
            if (!items.length) return "";
            return `
              <section class="shelf" aria-label="${section}">
                <div class="shelf-header">
                  <h2>${section}</h2>
                  <span>${items.length} ${items.length === 1 ? "title" : "titles"}</span>
                </div>
                <div class="rail">${items.map(cardTemplate).join("")}</div>
              </section>
            `;
          })
          .join("");

        shelves.innerHTML = blocks;
        document.querySelector("#emptyState").classList.toggle("visible", visible.length === 0);
      }

      function renderStats() {
        const totalMinutes = titles.reduce((sum, item) => sum + item.runtime, 0);
        const avg = titles.reduce((sum, item) => sum + item.rating, 0) / titles.length;
        document.querySelector("#totalStat").textContent = titles.length;
        document.querySelector("#ratingStat").textContent = avg.toFixed(1);
        document.querySelector("#hoursStat").textContent = `${Math.round(totalMinutes / 60)}h`;
      }

      function renderSpotlight() {
        const item = titles.find(title => title.id === state.featured) || titles[0];
        document.querySelector("#spotlight").style.setProperty("--tone", item.tone);
        document.querySelector("#spotlightTitle").textContent = item.title;
        document.querySelector("#spotlightCopy").textContent = item.description;
        document.querySelector("#openFeatured").dataset.id = item.id;
      }

      function keyValueRows(object) {
        return Object.entries(object).map(([key, value]) => `
          <div class="kv"><span>${key}</span><strong>${value}</strong></div>
        `).join("");
      }

      function openDrawer(id) {
        const item = titles.find(title => title.id === id);
        if (!item) return;
        drawerArt.style.setProperty("--tone", item.tone);
        drawerContent.innerHTML = `
          <div class="drawer-title">
            <div>
              <h2>${item.title}</h2>
              <div class="meta-line">
                <span class="pill">${item.type}</span>
                <span class="pill">${item.year}</span>
                <span class="pill">${item.status}</span>
                <span class="pill">${item.runtime} min</span>
              </div>
            </div>
            <div class="score">${item.rating.toFixed(1)}</div>
          </div>
          <p class="description">${item.description}</p>
          <div class="detail-grid">
            <section class="detail-section">
              <h3>Genres</h3>
              <div class="people">${item.genre.map(value => `<span class="person">${value}</span>`).join("")}</div>
            </section>
            <section class="detail-section">
              <h3>Actors / Characters</h3>
              ${item.cast.map((actor, index) => `
                <div class="kv"><span>${actor}</span><strong>${item.characters[index] || "Featured"}</strong></div>
              `).join("")}
            </section>
            <section class="detail-section">
              <h3>Production Info</h3>
              ${keyValueRows(item.production)}
            </section>
            <section class="detail-section">
              <h3>Staff</h3>
              ${keyValueRows(item.staff)}
            </section>
          </div>
        `;
        drawer.classList.add("open");
        backdrop.classList.add("open");
        drawer.setAttribute("aria-hidden", "false");
      }

      function closeDrawer() {
        drawer.classList.remove("open");
        backdrop.classList.remove("open");
        drawer.setAttribute("aria-hidden", "true");
      }

      tabs.addEventListener("click", event => {
        const tab = event.target.closest("button[data-filter]");
        if (!tab) return;
        state.filter = tab.dataset.filter;
        renderTabs();
        renderShelves();
      });

      shelves.addEventListener("click", event => {
        const thumb = event.target.closest("button[data-id]");
        if (!thumb) return;
        openDrawer(thumb.dataset.id);
      });

      search.addEventListener("input", event => {
        state.query = event.target.value;
        renderShelves();
      });

      document.querySelector("#openFeatured").addEventListener("click", event => {
        openDrawer(event.currentTarget.dataset.id);
      });

      document.querySelector("#closeDrawer").addEventListener("click", closeDrawer);
      backdrop.addEventListener("click", closeDrawer);
      document.addEventListener("keydown", event => {
        if (event.key === "Escape") closeDrawer();
      });

      renderTabs();
      renderStats();
      renderSpotlight();
      renderShelves();
    </script>
  </body>
</html>
