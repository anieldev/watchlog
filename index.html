<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watchlog</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand-row">
          <a class="brand" href="#" aria-label="Watchlog home">
            <span class="brand-mark">W</span>
            <span>
              <strong>Watchlog</strong>
              <small>Personal media archive</small>
            </span>
          </a>
          <div class="count-pill" id="libraryCount">0 titles</div>
        </div>

        <label class="search-wrap">
          <span class="sr-only">Search archive</span>
          <input id="searchInput" type="search" placeholder="Search title, cast, studio..." />
        </label>
      </header>

      <main class="page">
        <section class="format-tabs" id="formatTabs" aria-label="Media type"></section>

        <div class="workspace">
          <section class="library" aria-label="Watch archive">
            <div class="library-heading">
              <div>
                <h1>Library</h1>
                <p id="resultSummary">Browse everything you have watched.</p>
              </div>
            </div>

            <section class="filter-bar" aria-label="Filters">
              <div class="dropdown-filter" data-dropdown="sort">
                <button class="filter-trigger" type="button" aria-expanded="false">
                  <span>Sort</span>
                  <strong id="sortSummary">Recently watched</strong>
                </button>
                <div class="filter-menu" id="sortMenu"></div>
              </div>

              <div class="dropdown-filter" data-dropdown="categories">
                <button class="filter-trigger" type="button" aria-expanded="false">
                  <span>Categories</span>
                  <strong id="categorySummary">Any</strong>
                </button>
                <div class="filter-menu" id="categoryMenu"></div>
              </div>

              <div class="dropdown-filter" data-dropdown="countries">
                <button class="filter-trigger" type="button" aria-expanded="false">
                  <span>Countries</span>
                  <strong id="countrySummary">Any</strong>
                </button>
                <div class="filter-menu" id="countryMenu"></div>
              </div>

              <div class="dropdown-filter" data-dropdown="release">
                <button class="filter-trigger" type="button" aria-expanded="false">
                  <span>Release</span>
                  <strong id="releaseSummary">All years</strong>
                </button>
                <div class="filter-menu release-menu" id="releaseMenu">
                  <div class="preset-row" id="releasePresets"></div>
                  <div class="year-fields">
                    <label>
                      <span>From</span>
                      <input id="fromYear" type="number" inputmode="numeric" />
                    </label>
                    <label>
                      <span>To</span>
                      <input id="toYear" type="number" inputmode="numeric" />
                    </label>
                  </div>
                </div>
              </div>

              <button class="ghost-button" id="clearFilters" type="button">Clear</button>
            </section>

            <div class="active-filters" id="activeFilters" aria-live="polite"></div>
            <div class="card-grid" id="cardGrid"></div>
            <div class="empty-state" id="emptyState">
              <strong>No matches</strong>
              <span>Try clearing a filter or searching for something broader.</span>
            </div>
          </section>
        </div>
      </main>
    </div>

    <div class="backdrop" id="backdrop"></div>
    <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Title details">
      <button class="drawer-close" id="drawerClose" type="button" aria-label="Close details">Esc</button>
      <div id="drawerContent"></div>
    </aside>

    <script type="module" src="./app.js"></script>
  </body>
</html>
